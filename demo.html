<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>RAG 知识库问答</title>

    <!-- Markdown 渲染库：将模型输出的 Markdown 转为 HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        /* ========== 全局重置 ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* ========== 页面整体布局 ========== */
        body {
            max-width: 900px;
            margin: 40px auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fa;
            padding: 0 20px;
        }
        h2 { color: #333; margin-bottom: 20px; }

        /* ========== 输入框区域 ========== */
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        #input {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        #input:focus { border-color: #4a90d9; }
        #send {
            padding: 12px 28px;
            background: #4a90d9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        #send:hover { background: #3a7bc8; }
        #send:disabled { background: #aaa; cursor: not-allowed; }

        .btn-secondary {
            padding: 12px 20px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background: #e0e0e0; }

        /* ========== 加载动画（嵌入对话流中） ========== */
        .msg-loading {
            align-self: flex-start;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #666;
            font-size: 14px;
            padding: 16px 24px;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            margin-bottom: 0;
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top-color: #4a90d9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== 聊天容器 ========== */
        #chat-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* 用户消息气泡 */
        .msg-user {
            align-self: flex-end;
            max-width: 80%;
            background: #4a90d9;
            color: white;
            padding: 12px 18px;
            border-radius: 16px 16px 4px 16px;
            line-height: 1.6;
            font-size: 14px;
            word-break: break-word;
        }

        /* AI 消息气泡 */
        .msg-ai {
            align-self: flex-start;
            max-width: 90%;
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 20px 24px;
            line-height: 1.7;
            color: #333;
            min-width: 200px;
        }
        .msg-ai h1, .msg-ai h2, .msg-ai h3 { margin: 16px 0 8px; }
        .msg-ai p { margin-bottom: 12px; }
        .msg-ai code {
            background: #f0f2f5; padding: 2px 6px;
            border-radius: 4px; font-size: 13px;
        }
        .msg-ai pre {
            background: #1e1e1e; color: #d4d4d4;
            padding: 16px; border-radius: 8px;
            overflow-x: auto; margin: 12px 0;
        }
        .msg-ai pre code { background: none; padding: 0; }
        .msg-ai ul, .msg-ai ol { padding-left: 24px; margin-bottom: 12px; }
        .msg-ai li { margin-bottom: 4px; }

        /* 每条回答对应的引用来源 */
        .msg-sources {
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: 12px;
            color: #888;
        }
        .msg-sources-title { margin-bottom: 6px; font-weight: 500; }
        .msg-source-item {
            display: flex; justify-content: space-between;
            padding: 3px 0; color: #666;
        }
        .btn-danger {
            background: #fff0f0;
            color: #d9534f;
        }
        .btn-danger:hover { background: #ffe0e0; }
    </style>
</head>
<body>
    <h2>📚 RAG 知识库问答系统</h2>

    <!-- 输入区域 -->
    <div class="input-row">
        <input type="text" id="input" placeholder="输入你的问题..." value="介绍一下的教育背景">
        <button id="send">发送</button>
        <button id="clear-btn" class="btn-secondary">清空对话</button>
        <button id="clear-memory-btn" class="btn-secondary btn-danger">清空全部记忆</button>
    </div>

    <!-- 聊天记录容器 -->
    <div id="chat-container"></div>

    <script>
        // ========== 会话ID（短期记忆标识，localStorage持久化） ==========
        let sessionId = localStorage.getItem('rag_session_id');
        if (!sessionId) {
            sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('rag_session_id', sessionId);
        }

        // ========== DOM 元素获取 ==========
        const btn = document.getElementById('send');
        const clearBtn = document.getElementById('clear-btn');
        const input = document.getElementById('input');
        const chatContainer = document.getElementById('chat-container');

        // 配置 Markdown 渲染：支持换行自动转 <br>
        marked.setOptions({ breaks: true });

        // ========== 发送按钮点击事件 ==========
        btn.addEventListener('click', () => {
            const question = input.value.trim();
            if (!question) return;

            input.value = '';
            btn.disabled = true;

            // 1. 追加用户消息气泡
            appendUserMessage(question);

            // 2. 在用户消息下方插入加载动画
            const loadingEl = appendLoading('正在检索知识库与生成回答...');

            // 3. 创建AI消息气泡（空容器，后续流式填充）
            const aiMsgEl = appendAiMessage();
            const aiContentEl = aiMsgEl.querySelector('.ai-content');
            const aiSourcesEl = aiMsgEl.querySelector('.ai-sources');

            let fullText = '';

            // 建立 SSE 长连接，携带 session_id 实现短期记忆
            const es = new EventSource(
                `http://localhost:8000/chat/stream?question=${encodeURIComponent(question)}&session_id=${encodeURIComponent(sessionId)}`
            );

            // ========== SSE 消息处理 ==========
            es.onmessage = (e) => {
                const data = JSON.parse(e.data);

                // 消息类型1：参考来源（检索完成，切换加载文字）
                if (data.type === 'sources') {
                    renderSourcesInline(aiSourcesEl, data.sources);
                    loadingEl.querySelector('.loading-text').textContent = '正在生成回答...';
                }

                // 消息类型2：回答内容（第一个字到达，移除加载动画）
                if (data.type === 'content') {
                    if (loadingEl && loadingEl.parentNode) {
                        loadingEl.remove();
                    }
                    fullText += data.content;
                    aiContentEl.innerHTML = renderWithThink(fullText);
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }

                // 消息类型3：生成结束
                if (data.type === 'done') {
                    es.close();
                    btn.disabled = false;
                    input.focus();
                }
            };

            // SSE 连接出错处理
            es.onerror = () => {
                es.close();
                if (loadingEl && loadingEl.parentNode) {
                    loadingEl.remove();
                }
                btn.disabled = false;
            };
        });

        // ========== 【修改后】清空对话逻辑：只清页面+后端短期记忆，保留sessionId ==========
        clearBtn.addEventListener('click', async () => {
            if (!confirm('确定清空当前页面对话记录与短期上下文？历史长期记忆不会删除，会话身份不变。')) return;

            // 1. 调用后端清空该会话的短期内存历史
            try {
                await fetch(`http://localhost:8000/clear_history?session_id=${encodeURIComponent(sessionId)}`, {
                    method: 'DELETE'
                });
            } catch (e) {
                console.warn('清空后端短期记忆失败', e);
            }

            // 【关键改动】删除生成新sessionId、覆盖localStorage的代码，sessionId全程不变
            // sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
            // localStorage.setItem('rag_session_id', sessionId);

            // 2. 仅清空前端页面聊天DOM
            chatContainer.innerHTML = '';
        });

        // ========== 清空全部长期记忆 ==========
        const clearMemoryBtn = document.getElementById('clear-memory-btn');
        clearMemoryBtn.addEventListener('click', async () => {
            if (!confirm('确定清空所有长期记忆吗？\n所有历史对话记忆将永久删除，无法恢复！')) return;

            try {
                const res = await fetch('http://localhost:8000/clear_long_term_memory', {
                    method: 'DELETE'
                });
                const data = await res.json();
                alert(data.message);
                // 清空全部记忆后，主动换新session，彻底隔离旧记忆
                sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('rag_session_id', sessionId);
                chatContainer.innerHTML = '';
            } catch (e) {
                alert('清空失败：' + e.message);
            }
       });


        // ========== 追加用户消息气泡 ==========
        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg-user';
            div.textContent = text;
            chatContainer.appendChild(div);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // ========== 追加加载动画气泡（在用户消息下方、AI回答上方） ==========
        function appendLoading(text) {
            const div = document.createElement('div');
            div.className = 'msg-loading';
            div.innerHTML = `
                <div class="spinner"></div>
                <span class="loading-text">${text}</span>
            `;
            chatContainer.appendChild(div);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            return div;
        }

        // ========== 追加AI消息气泡（返回DOM元素，后续流式填充内容） ==========
        function appendAiMessage() {
            const div = document.createElement('div');
            div.className = 'msg-ai';
            div.innerHTML = `
                <div class="ai-content"></div>
                <div class="ai-sources msg-sources" style="display: none;"></div>
            `;
            chatContainer.appendChild(div);
            return div;
        }

        // ========== 思考过程 + 回答 渲染函数 ==========
        function renderWithThink(text) {
            const thinkMatch = text.match(/([\s\S]*?)<\/think>/);
            let thinkContent = '';
            let mainContent = text;

            if (thinkMatch) {
                thinkContent = thinkMatch[1].trim();
                mainContent = text.replace(/[\s\S]*?<\/think>/, '').trim();
            } else if (text.includes('')) {
                const thinkStart = text.indexOf('') + 7;
                thinkContent = text.substring(thinkStart).trim();
                mainContent = '';
            }

            let html = '';

            if (thinkContent) {
                html += `
                    <div style="background: #f9f9f9; border-left: 3px solid #ccc; padding: 12px 16px; margin-bottom: 16px; border-radius: 0 8px 8px 0;">
                        <div style="font-size: 12px; color: #999; margin-bottom: 6px;">💭 思考过程</div>
                        <div style="color: #666; font-size: 13px; line-height: 1.6; white-space: pre-wrap;">${escapeHtml(thinkContent)}</div>
                    </div>
                `;
            }

            if (mainContent) {
                html += marked.parse(mainContent);
            }

            return html;
        }

        // ========== HTML 转义函数 ==========
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ========== 渲染单条回答内联的引用来源 ==========
function renderSourcesInline(container, sources) {
    if (!sources || sources.length === 0) return;

    const unique = [...new Map(sources.map(s => [s.filename + s.page, s])).values()];

    let html = '<div class="msg-sources-title">📎 参考来源</div>';
    unique.forEach(s => {
        let rightText;
        if (s.filename === "历史对话") {
            // 历史对话：右侧展示当前sessionId，不再显示页码
            rightText = `会话ID：${sessionId}`;
        } else {
            // PDF文档：正常显示页码
            rightText = `第 ${parseInt(s.page) + 1} 页`;
        }
        html += `
            <div class="msg-source-item">
                <span>📄 ${s.filename}</span>
                <span>${rightText}</span>
            </div>
        `;
    });

    container.innerHTML = html;
    container.style.display = 'block';
}
        // ========== 回车快捷发送 ==========
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') btn.click();
        });
    </script>
</body>
</html>
